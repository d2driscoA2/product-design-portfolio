  <rect x="844" y="522" width="100" height="4" rx="1" fill="#999"/>

  <line x1="72" y1="582" x2="1128" y2="582" stroke="#E0E0E0" stroke-width="1"/>
  <text x="72" y="608" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif" font-size="14" fill="#6B6B6B">The mental model leads. The data confirms it. Cognitive load drops because the search space shrinks.</text>
