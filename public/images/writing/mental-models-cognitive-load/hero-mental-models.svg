  <rect x="844" y="440" width="56" height="6" rx="1" fill="#FFCB05"/>
  <rect x="844" y="454" width="100" height="4" rx="1" fill="#999"/>
  <rect x="844" y="462" width="80" height="4" rx="1" fill="#999"/>
  <rect x="828" y="494" width="280" height="48" rx="6" fill="#F5F5F5"/>
