  <rect x="472" y="348" width="70" height="4" rx="1" fill="#C0C0C0"/>
  <text x="608" y="324" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif" font-size="20" font-weight="500" fill="#6B6B6B">12%</text>
  <text x="608" y="346" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif" font-size="13" fill="#6B6B6B">CTR</text>
  <text x="464" y="396" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif" font-size="14" font-weight="500" fill="#4063FB">Variant B · shuffled</text>
  <rect x="464" y="408" width="120" height="60" rx="4" fill="#FFFFFF" stroke="#4063FB" stroke-width="1.5"/>
  <rect x="472" y="416" width="34" height="22" rx="2" fill="#FF6F6E"/>
  <rect x="510" y="416" width="34" height="22" rx="2" fill="#FFCB05"/>
  <rect x="548" y="416" width="28" height="22" rx="2" fill="#6DA3F8"/>
  <rect x="472" y="444" width="100" height="4" rx="1" fill="#4063FB"/>
  <rect x="472" y="454" width="70" height="4" rx="1" fill="#4063FB"/>
  <text x="608" y="430" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif" font-size="20" font-weight="500" fill="#4063FB">23%↑</text>
  <text x="608" y="452" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif" font-size="13" fill="#6B6B6B">CTR</text>
  <line x1="464" y1="490" x2="736" y2="490" stroke="#E0E0E0" stroke-width="1"/>
  <text x="464" y="514" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif" font-size="14" font-weight="500" fill="#1a1a1a">n = 250,000 / variant</text>
  <text x="464" y="532" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif" font-size="14" fill="#4063FB">Model confirmed.</text>

  <line x1="770" y1="400" x2="798" y2="400" stroke="#4063FB" stroke-width="1.5" marker-end="url(#arrow)"/>

